[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# --- Redirects van oude URL's (huidige Autosociaal-site) ---

[[redirects]]
  from = "/afspraak-maken"
  to = "/afspraak/"
  status = 301

[[redirects]]
  from = "/afspraak/details"
  to = "/afspraak/"
  status = 301

[[redirects]]
  from = "/afspraak/details/*"
  to = "/afspraak/"
  status = 301

[[redirects]]
  from = "/contact/vestigingen/265"
  to = "/contact/#kampeermeer"
  status = 301

[[redirects]]
  from = "/contact/vestigingen/451"
  to = "/contact/#lokerse"
  status = 301

# --- Headers ---

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/afspraak/bedankt/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/styleguide/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
