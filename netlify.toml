[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# --- Redirects van oude URL's (huidige Autosociaal-site) ---

[[redirects]]
  from = "/afspraak-maken"
  to = "/afspraak/"
  status = 301

[[redirects]]
  from = "/afspraak/details"
  to = "/afspraak/"
  status = 301

[[redirects]]
  from = "/contact/vestigingen/265"
  to = "/contact/#kampeermeer"
  status = 301

[[redirects]]
  from = "/contact/vestigingen/451"
  to = "/contact/#lokerse"
  status = 301

# --- Headers ---

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styleguide/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
